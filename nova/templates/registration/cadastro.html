{% extends 'base.html' %}

{% block title %}NOVA | Criar conta{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <p class="tag-tech mb-1">ACESSO NOVA</p>
      <h1 class="h2 mb-3">Criar conta</h1>

      <form method="post" class="form-login">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-aurora w-100 mt-2">Cadastrar</button>
      </form>

      <p class="small mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
  </div>
</div>
{% endblock %}
