{% extends 'base.html' %}

{% block title %}NOVA | Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <p class="tag-tech mb-1">ACESSO NOVA</p>
      <h1 class="h2 mb-3">Entrar</h1>

      {% if request.GET.next %}
        <div class="alert alert-info">Faça login para continuar.</div>
      {% endif %}

      <form method="post" class="form-login">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-aurora w-100 mt-2">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
